name: Practice engine checks
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - run: node scripts/check-built-fonts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cadence-static
          include-hidden-files: true
          path: |
            dist/
            .openai/hosting.json
