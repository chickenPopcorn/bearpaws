name: Practice engine checks
on:
  push:
    # A merge queue's gh-readonly-queue/* branches also fire push; the
    # merge_group run below already checks them. A branch filter alone would
    # also drop tag pushes, so tags are listed too.
    branches-ignore: ["gh-readonly-queue/**"]
    tags: ["**"]
  pull_request:
  merge_group:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails when coverage falls below the floor in vite.config.ts.
      - run: npm run test:coverage
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
        env:
          # Public values, the same the Pages build uses: the artifact below
          # can be deployed on its own, and sign-in needs them.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: node scripts/check-built-fonts.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cadence-static
          include-hidden-files: true
          path: |
            dist/
            .openai/hosting.json
