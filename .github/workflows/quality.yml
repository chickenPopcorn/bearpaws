name: Code quality
on: [push, pull_request]
jobs:
  lint-format-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # The app and its tests, then the browser tests (e2e/tsconfig.json).
      - run: npx tsc -b . e2e
