<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#7354cf" />
    <link rel="icon" type="image/svg+xml" href="/bearpaws.svg?v=3" />
    <link
      rel="preload"
      href="/fonts/libre-baskerville.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bravura.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/cinzel-decorative.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <meta
      name="description"
      content="Paw Pal — a local MIDI piano practice studio. Listen, slow down, and learn one phrase at a time."
    />
    <title>Paw Pal · Piano practice studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Show the page as it was left until the app renders over it (see
      // src/reloadSnapshot.ts). The dev server styles the page from script,
      // and markup without its stylesheet would flash unstyled.
      (function () {
        try {
          var key = "cadence:reload-snapshot";
          var saved = JSON.parse(sessionStorage.getItem(key) || "null");
          sessionStorage.removeItem(key);
          // The saved page can show an account's songs and progress, so show
          // it only while this browser still holds a Supabase sign-in.
          var signedIn = false;
          for (var k = 0; k < localStorage.length; k++)
            if (/^sb-.+-auth-token$/.test(localStorage.key(k) || ""))
              signedIn = true;
          if (
            !saved ||
            !signedIn ||
            !document.querySelector('link[rel="stylesheet"]')
          )
            return;
          var root = document.getElementById("root");
          root.innerHTML = saved.html;
          root.querySelectorAll("canvas").forEach(function (canvas, i) {
            if (saved.canvases[i])
              canvas.style.background =
                "url(" + saved.canvases[i] + ") 0 0 / 100% 100%";
          });
          // It only looks like the app, so keep clicks and focus off it.
          for (var i = 0; i < root.children.length; i++)
            root.children[i].inert = true;
        } catch (error) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
